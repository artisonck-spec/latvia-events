name: Event list

# Runs when the event list changes (the scheduled search commits it) and once a day:
# checks the list and adds pictures from each event's own page.
on:
  push:
    branches: [main]
    paths: ['data/events.json']
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data
  cancel-in-progress: false

jobs:
  data:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Check the event list
        run: python3 tools/validate_events.py data/events.json
      - name: Add event pictures
        run: python3 tools/fetch_images.py data/events.json
      - name: Check again and save
        run: |
          python3 tools/validate_events.py data/events.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/events.json
          git commit -m "Event pictures added" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
